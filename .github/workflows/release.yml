name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build
        run: |
          mkdir -p dist
          bun build --compile --target=bun-darwin-arm64 --minify ./src/index.mjs --outfile dist/zaid-darwin-arm64

      - name: Verify signature and smoke test
        run: |
          codesign --verify dist/zaid-darwin-arm64
          ./dist/zaid-darwin-arm64 --version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: zaid-darwin-arm64
          path: dist/*

  release:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Attach binaries to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
